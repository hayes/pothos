mutation CreateFriends {
  createGiraffeWithFriends(
    input: {
      name: "Gina"
      birthdate: "2020-03-15"
      height: 4.8
      friends: [
        {
          name: "George"
          birthdate: "2021-06-01"
          height: 4.5
          friends: [{ name: "Gemma", birthdate: "2022-08-10", height: 3.9 }]
        }
      ]
    }
  ) {
    name
    height
  }
}
