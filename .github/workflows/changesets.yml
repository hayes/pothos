name: Changesets

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      trust_check:
        description: 'Validate npm trusted publishing with dry-run publishes instead of releasing'
        type: boolean
        default: false
env:
  CI: true

jobs:
  version:
    if: ${{ !inputs.trust_check }}
    environment: npm-release
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      repository-projects: write
      deployments: write
      packages: write
      pull-requests: write

    services:
      prisma-next-postgres:
        image: postgres:18.2
        ports:
          - '5456:5432'
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: prisma_next
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: mghayes/multi-postgres:v2
        ports:
          - '5455:5432'
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_MULTIPLE_DATABASES: tests,drizzle

        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: checkout code repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup turbo cache
        uses: actions/cache@v3
        with:
          path: node_modules/.cache
          key: turbo-${{ runner.os }}-18-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Creating .npmrc
        run: |
          cat << EOF > "$HOME/.npmrc"
            email=michael@hayes.io
            //registry.npmjs.org/:_authToken=$NPM_TOKEN
          EOF
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create PR or Publish release
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run ci:version
          commit: 'chore: update versions'
          title: 'chore: update versions'
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Validates each package's npm trusted-publishing config without publishing. A dry-run publish
  # performs the OIDC token exchange, which counts as using the config; new configs expire if they
  # aren't used within 48 hours. Configs are tied to this workflow file and environment.
  trust-check:
    if: ${{ inputs.trust_check }}
    environment: npm-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout code repository
        uses: actions/checkout@v3

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate trusted publishing
        run: |
          failed=()
          for dir in packages/*/; do
            name=$(node -p "const p = require('./${dir}package.json'); p.private ? '' : p.name")
            [ -n "$name" ] || continue
            # A version that's already on npm stops at npm's version check, after the exchange.
            out=$(cd "$dir" && NPM_CONFIG_LOGLEVEL=verbose pnpm publish --dry-run --ignore-scripts --no-git-checks 2>&1 || true)
            if grep -q 'oidc Successfully retrieved and set token' <<< "$out"; then
              echo "ok      $name"
            else
              echo "FAILED  $name"
              grep -E ' oidc |npm error' <<< "$out" | sed 's/^/        /'
              failed+=("$name")
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Trusted-publishing token exchange failed for: ${failed[*]}"
            exit 1
          fi
