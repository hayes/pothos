name: Publish Pull requests
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup turbo cache
        uses: actions/cache@v3
        with:
          path: node_modules/.cache
          key: turbo-${{ runner.os }}-pkg-pr-new-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build

      # pkg-pr-new skips private packages. This only changes the runner's checkout.
      - name: Include the private Prisma Next plugin
        run: node scripts/prisma-next-preview.mjs

      - run: pnpm dlx pkg-pr-new publish --compact './packages/plugin-*' './packages/core' './packages/selection-mapper' './packages/tracing-*'
