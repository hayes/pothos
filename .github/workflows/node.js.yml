# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      prisma-next-postgres:
        image: postgres:18.2
        ports:
          - '5456:5432'
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: prisma_next
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      prisma-next-mysql:
        image: mysql:8.4
        ports:
          - '5478:3306'
        env:
          MYSQL_ROOT_PASSWORD: prisma
          MYSQL_DATABASE: prisma_next
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pprisma"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: mghayes/multi-postgres:v2
        ports:
          - '5455:5432'
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_MULTIPLE_DATABASES: tests,drizzle

        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup turbo cache
        uses: actions/cache@v3
        with:
          path: node_modules/.cache
          key: turbo-${{ runner.os }}-${{ matrix.node }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        if: ${{ matrix.node != 22 }}
        run: pnpm run ci
        env:
          POTHOS_PRISMA_NEXT_MYSQL_URL: mysql://root:prisma@127.0.0.1:5478/prisma_next?allowPublicKeyRetrieval=true

      # Prisma ORM 8 supports Node 24 and up, so the plugin is only tested there.
      - name: Run build without Prisma Next tests
        if: ${{ matrix.node == 22 }}
        run: |
          pnpm turbo run build generate --concurrency=4
          pnpm turbo run test type --concurrency=4 --filter='!@pothos/plugin-prisma-next'
          pnpm run lint:ci

  prisma-next-consumer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter='@pothos/plugin-prisma-next...'

      - name: Check the packed plugin from a fresh project
        run: node scripts/prisma-next-consumer-check.mjs
